name: CI

on:
  push:
    branches: [main]
  pull_request:

# No permissions by default; jobs opt in to exactly what they need.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, type-check, test & bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up toolchain (node, actionlint, zizmor)
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: Install dependencies
        run: npm ci

      - name: Lint & format check (Biome)
        run: npm run check

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Bundle dist/
        run: npm run package
